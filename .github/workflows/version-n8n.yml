# Cada día hábil, antes de que se encienda la VM, compara la versión de n8n fijada en
# docker-compose.yml con la estable oficial. Si hay una más nueva, la fija, valida el
# compose y la sube a main: la VM la aplica sola en su siguiente sincronización.
# Solo sigue la etiqueta "stable" de n8n (nunca beta). No usa Dependabot porque propondría
# las versiones beta.
name: Versión de n8n

on:
  schedule:
    - cron: '0 12 * * 1-5' # lunes a viernes 7:00 hora Bogotá (UTC-5)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: version-n8n
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fijar la versión estable de n8n
        id: version
        run: |
          set -euo pipefail
          fijada=$(grep -oE 'n8nio/n8n:[0-9.]+' docker-compose.yml | cut -d: -f2)
          estable=$(npm view n8n dist-tags.stable)
          echo "Fijada: $fijada · estable: $estable"
          if [ "$(printf '%s\n%s\n' "$fijada" "$estable" | sort -V | tail -1)" = "$fijada" ]; then
            echo "n8n está en la última versión estable."
            exit 0
          fi
          docker manifest inspect "docker.n8n.io/n8nio/n8n:$estable" > /dev/null
          sed -i "s|n8nio/n8n:$fijada|n8nio/n8n:$estable|" docker-compose.yml
          sed -i "s|n8n fijado en la versión \`$fijada\`|n8n fijado en la versión \`$estable\`|" README.md
          docker compose config --quiet
          echo "nueva=$estable" >> "$GITHUB_OUTPUT"

      - name: Subir a main
        if: steps.version.outputs.nueva != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "fix(seguridad): n8n actualizado a ${{ steps.version.outputs.nueva }}"
          git push origin HEAD:main
